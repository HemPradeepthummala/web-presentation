<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height:100vh;
      width:100vw;
      background-color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .canvas {
      height: 80vh;
      width:80vw;
      background-color: whitesmoke;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .title {
      font-size: 5em;
      margin: 20px;
    }

    .sub-title {
      font-size: 3em;
      margin: 20px;
    }
  </style>
</head>
<body>
  <article class="canvas">
      <h1 class="title">Presentation</h1>
      <p class="sub-title">This is the presentation page.</p>
  </article>
</body>
</html>
