<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="./presentation.js"></script>
    <title>Presentation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        width: 100vw;
        background-color: #f0f0f0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
      }

      .slide {
        height: 80vh;
        width: 80vw;
        background-color: whitesmoke;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      }

      .title {
        font-size: 5em;
        margin: 20px;
      }

      .sub-title {
        font-size: 4em;
        margin: 20px;
      }

      .list {
        font-size: 3em;
        margin: 40px;
        padding: 20px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <article class="slide">
        <h1 class="title">Presentation</h1>
        <p class="sub-title">This is the presentation page.</p>
      </article>
      <article class="slide hidden">
        <h2 class="sub-title">Overview</h2>
        <ul class="list">
          <li class="item">slide 1</li>
          <li class="item">slide 2</li>
          <li class="item">slide 3</li>
        </ul>
      </article>
    </main>
  </body>
</html>
